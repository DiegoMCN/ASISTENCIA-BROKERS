<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#202845" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Check-in" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23202845'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23C9A96E' font-family='sans-serif'%3EiM%3C/text%3E%3C/svg%3E" />
<title>iMexico · Check-in de asesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#202845;
    --navy-light:#2e3a63;
    --gold:#C9A96E;
    --gold-dark:#8a6d3b;
    --cream:#F7F5F1;
    --line:#E4E1D8;
    --ok:#3F7D4E;
    --warn:#B0791F;
    --text:#202845;
    --muted:#75746D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans',sans-serif;
    background:var(--cream);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    background:var(--navy);
    color:#fff;
    padding:22px 20px 20px;
    text-align:center;
  }
  header h1{
    font-family:'DM Serif Display',serif;
    font-size:22px;
    font-weight:400;
    margin:0;
    letter-spacing:0.3px;
  }
  header p{
    margin:4px 0 0;
    font-size:12px;
    color:#C9CBDA;
  }
  main{
    width:100%;
    max-width:420px;
    padding:20px 18px 60px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:500;
  }
  select, input[type=time], input[type=text]{
    width:100%;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'DM Sans',sans-serif;
    font-size:15px;
    color:var(--text);
  }
  select:focus, input:focus{
    outline:none;
    border-color:var(--gold-dark);
    box-shadow:0 0 0 3px rgba(201,169,110,0.25);
  }
  .field{margin-bottom:14px;}
  .datetime{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-bottom:16px;
  }
  .toggle-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .toggle{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:16px 8px;
    border-radius:11px;
    border:1.5px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
    color:var(--muted);
    transition:border-color .15s, background .15s, color .15s;
  }
  .toggle svg{width:22px;height:22px;stroke:var(--muted);transition:stroke .15s;}
  .toggle.active{
    border-color:var(--gold-dark);
    background:rgba(201,169,110,0.12);
    color:var(--gold-dark);
    font-weight:500;
  }
  .toggle.active svg{stroke:var(--gold-dark);}
  .conditional{
    background:var(--cream);
    border-radius:11px;
    padding:14px;
    margin-bottom:14px;
    display:none;
  }
  .conditional.show{display:block;}
  .time-row{display:flex;gap:10px;}
  .time-row .field{flex:1;margin-bottom:0;}
  .slots-status{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .slots-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:8px;
  }
  .slot{
    padding:9px 4px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-size:12px;
    text-align:center;
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .slot.ocupado{
    background:#F5E4E2;
    border-color:#dcbdb8;
    color:#A32D2D;
    cursor:not-allowed;
    text-decoration:line-through;
    opacity:0.75;
  }
  .slot.selected{
    background:var(--gold);
    border-color:var(--gold-dark);
    color:#3a2e14;
    font-weight:700;
  }
  .slot.in-range{
    background:rgba(201,169,110,0.28);
    border-color:var(--gold-dark);
  }
  .slots-hint{font-size:11px;color:var(--muted);min-height:14px;}
  .ocupados-list{margin-top:6px;font-size:11px;color:var(--muted);}
  .ocupados-list .item{padding:4px 0;border-top:1px solid var(--line);}
  .ocupados-list .item:first-child{border-top:none;}
  .ocupados-list b{color:var(--text);font-weight:500;}
  button.submit{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    background:var(--gold);
    color:#3a2e14;
    font-family:'DM Sans',sans-serif;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button.submit:active{transform:scale(0.98);}
  button.submit:disabled{opacity:0.55;cursor:default;}
  .confirm{
    display:none;
    text-align:center;
    padding:26px 20px;
  }
  .confirm.show{display:block;}
  .confirm .check{
    width:48px;height:48px;
    border-radius:50%;
    background:var(--ok);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
  }
  .confirm .check svg{width:24px;height:24px;stroke:#fff;stroke-width:3;fill:none;}
  .confirm p.big{font-family:'DM Serif Display',serif;font-size:18px;margin:0 0 4px;}
  .confirm p.small{font-size:12px;color:var(--muted);margin:0;}
  .confirm button.again{
    margin-top:20px;
    background:none;
    border:1px solid var(--line);
    color:var(--navy);
    padding:10px 18px;
    border-radius:9px;
    font-size:13px;
    cursor:pointer;
  }
  .error{
    color:#A32D2D;
    font-size:12px;
    margin-top:8px;
    display:none;
  }
  .error.show{display:block;}
  .form-wrap.hidden{display:none;}
</style>
</head>
<body>

<header>
  <h1>iMexico Real Estate</h1>
  <p>Registro de asistencia — asesores</p>
</header>

<main>
  <div class="form-wrap" id="formWrap">
    <div class="card">
      <div class="field">
        <label for="asesor">Asesor</label>
        <select id="asesor">
          <option value="" disabled selected>Selecciona tu nombre</option>
        </select>
      </div>

      <div class="datetime" id="datetime"></div>

      <div class="toggle-row">
        <div class="toggle" id="toggleOficina" onclick="setEstatus('OFICINA')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/></svg>
          <span>Oficina</span>
        </div>
        <div class="toggle" id="toggleRecorrido" onclick="setEstatus('RECORRIDO')">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M5 17a2 2 0 104 0M15 17a2 2 0 104 0M5 17V10l2-5h10l2 5v7"/></svg>
          <span>Recorrido</span>
        </div>
      </div>

      <div class="conditional" id="recorridoFields">
        <div class="field">
          <label for="desarrollo">Desarrollo</label>
          <select id="desarrollo">
            <option value="" disabled selected>Selecciona el desarrollo</option>
          </select>
        </div>
        <div class="field">
          <label for="fechaRecorrido">Fecha del recorrido</label>
          <input type="date" id="fechaRecorrido" />
        </div>
        <div id="slotsWrap" style="display:none;">
          <label id="slotsLabel">Horario del recorrido</label>
          <div class="slots-status" id="slotsStatus">Selecciona un desarrollo para ver horarios disponibles.</div>
          <div class="slots-grid" id="slotsGrid"></div>
          <div class="slots-hint" id="slotsHint"></div>
          <div class="ocupados-list" id="ocupadosList"></div>
        </div>
      </div>

      <button class="submit" id="submitBtn" onclick="registrar()">Registrar</button>
      <div class="error" id="errorMsg"></div>
    </div>
  </div>

  <div class="confirm" id="confirmBox">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
    <p class="big" id="confirmTitle">Registrado</p>
    <p class="small" id="confirmDetail"></p>
    <button class="again" onclick="resetForm()">Registrar otro</button>
  </div>
</main>

<script>
const DEPLOY_URL = 'https://script.google.com/macros/s/AKfycbzlPAga-rYNqpkEiZcRZHxMwW2Re02geX2Eb1rilQWNVFoxnqlhVQIxoTej-p06J7KqrQ/exec';
const WORK_START = 8;  // primer horario del día (8:00)
const WORK_END = 19;   // último horario del día (18:00–19:00 es el último bloque)

let estatusActual = null;
let ocupados = [];        // rangos ocupados del desarrollo seleccionado, hoy
let slotStartIdx = null;
let slotEndIdx = null;

const asesorSel = document.getElementById('asesor');
const desarrolloSel = document.getElementById('desarrollo');
const fechaInput = document.getElementById('fechaRecorrido');
const submitBtn = document.getElementById('submitBtn');
submitBtn.disabled = true;
submitBtn.textContent = 'Cargando…';

function cargarConfig(intentoAutomatico){
  fetchConTimeout_(DEPLOY_URL + '?action=config')
    .then(r => r.json())
    .then(res => {
      if(res.ok){
        asesorSel.innerHTML = '<option value="" disabled selected>Selecciona tu nombre</option>';
        desarrolloSel.innerHTML = '<option value="" disabled selected>Selecciona el desarrollo</option>';
        res.asesores.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; asesorSel.appendChild(o); });
        res.desarrollos.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; desarrolloSel.appendChild(o); });
        submitBtn.disabled = false;
        submitBtn.textContent = 'Registrar';
        document.getElementById('errorMsg').classList.remove('show');
      } else {
        showError('No se pudo cargar la lista de asesores.');
      }
    })
    .catch(err => {
      console.error('Fallo al cargar configuración:', err);
      if(!intentoAutomatico){
        setTimeout(() => cargarConfig(true), 1500);
        return;
      }
      const el = document.getElementById('errorMsg');
      el.innerHTML = 'Sin conexión — no se pudo cargar la lista de asesores. <a href="#" onclick="cargarConfig();return false;" style="color:var(--gold-dark);font-weight:600;">Reintentar</a>';
      el.classList.add('show');
    });
}
cargarConfig();

// "Hoy" según la zona horaria de la Riviera Maya, sin importar en qué huso
// esté configurado el celular del asesor — así siempre coincide con el
// "hoy" que calcula el servidor (Code.gs usa la misma zona: America/Cancun).
function hoyStr(){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Cancun', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
fechaInput.value = hoyStr();
fechaInput.min = hoyStr();

function buildSlots(){
  const slots = [];
  for(let h = WORK_START; h < WORK_END; h++){
    slots.push({ start: String(h).padStart(2,'0') + ':00', end: String(h+1).padStart(2,'0') + ':00', startMin: h*60, endMin: (h+1)*60 });
  }
  return slots;
}
const SLOTS = buildSlots();

function overlapConOcupados(startMin, endMin){
  return ocupados.find(o => {
    const [oh1, om1] = o.horaSalida.split(':').map(Number);
    const [oh2, om2] = o.horaRegreso.split(':').map(Number);
    const oStart = oh1 * 60 + om1, oEnd = oh2 * 60 + om2;
    return startMin < oEnd && endMin > oStart;
  });
}

// Solo se dibujan los horarios LIBRES — los ocupados ni siquiera se muestran,
// para que no haya duda de cuáles se pueden elegir.
function renderSlots(){
  const grid = document.getElementById('slotsGrid');
  grid.innerHTML = '';
  SLOTS.forEach((s, i) => {
    if(overlapConOcupados(s.startMin, s.endMin)) return; // ocupado → se omite
    const div = document.createElement('div');
    div.className = 'slot';
    div.textContent = s.start;
    if(slotStartIdx !== null && slotEndIdx !== null && i >= slotStartIdx && i <= slotEndIdx){
      div.classList.add(i === slotStartIdx || i === slotEndIdx ? 'selected' : 'in-range');
    }
    div.onclick = () => onSlotClick(i);
    grid.appendChild(div);
  });
  if(!grid.children.length){
    grid.innerHTML = '<div style="grid-column:1/-1;font-size:12px;color:var(--muted);">No quedan horarios libres ese día en este desarrollo.</div>';
  }
}

function onSlotClick(i){
  document.getElementById('slotsHint').textContent = '';
  if(slotStartIdx === null || (slotStartIdx !== null && slotEndIdx !== null)){
    // empezar selección nueva
    slotStartIdx = i;
    slotEndIdx = null;
  } else {
    // ya hay inicio, este clic define el fin
    const start = Math.min(slotStartIdx, i);
    const end = Math.max(slotStartIdx, i);
    for(let k = start; k <= end; k++){
      if(overlapConOcupados(SLOTS[k].startMin, SLOTS[k].endMin)){
        document.getElementById('slotsHint').textContent = 'Ese rango cruza un horario ocupado. Elige otro.';
        slotStartIdx = i;
        slotEndIdx = null;
        renderSlots();
        return;
      }
    }
    slotStartIdx = start;
    slotEndIdx = end;
  }
  renderSlots();
}

function fechaLegible(f){
  const [y,m,d] = f.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' });
}

// fetch con límite de tiempo — si Apps Script tarda en "despertar" (cold start)
// o la señal se corta a medias, no se queda cargando para siempre.
function fetchConTimeout_(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || 12000);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(t));
}

function cargarDisponibilidad(intentoAutomatico){
  const desarrollo = desarrolloSel.value;
  const fecha = fechaInput.value;
  if(!desarrollo || !fecha) return;

  document.getElementById('slotsLabel').textContent = 'Horario del recorrido — ' + fechaLegible(fecha);
  const status = document.getElementById('slotsStatus');
  status.textContent = 'Consultando horarios de ' + desarrollo + '…';
  document.getElementById('slotsGrid').innerHTML = '';
  document.getElementById('ocupadosList').innerHTML = '';
  slotStartIdx = null; slotEndIdx = null;

  fetchConTimeout_(DEPLOY_URL + '?action=disponibilidad&desarrollo=' + encodeURIComponent(desarrollo) + '&fecha=' + fecha)
    .then(r => r.json())
    .then(res => {
      if(res.ok){
        ocupados = res.ocupados;
        status.textContent = ocupados.length
          ? 'Toca un horario libre de inicio y otro de fin.'
          : 'Sin recorridos agendados ese día en ' + desarrollo + ' — todos los horarios están libres.';
        renderSlots();
        renderOcupados();
      } else {
        status.innerHTML = 'No se pudo consultar disponibilidad. <a href="#" onclick="cargarDisponibilidad();return false;" style="color:var(--gold-dark);font-weight:600;">Reintentar</a>';
      }
    })
    .catch(err => {
      console.error('Fallo al consultar disponibilidad:', err);
      // un reintento automático y silencioso primero (cubre cortes breves de señal)
      if(!intentoAutomatico){
        setTimeout(() => cargarDisponibilidad(true), 1500);
        return;
      }
      status.innerHTML = 'Se perdió la conexión al consultar horarios. <a href="#" onclick="cargarDisponibilidad();return false;" style="color:var(--gold-dark);font-weight:600;">Reintentar</a>';
    });
}

function renderOcupados(){
  const el = document.getElementById('ocupadosList');
  if(!ocupados.length){ el.innerHTML = ''; return; }
  el.innerHTML = '<div class="item" style="border-top:none;font-weight:500;color:var(--text);">Ya ocupados ese día:</div>' +
    ocupados
      .slice()
      .sort((a,b) => a.horaSalida.localeCompare(b.horaSalida))
      .map(o => '<div class="item">' + o.horaSalida + ' a ' + o.horaRegreso + ' — <b>' + o.asesor + '</b></div>')
      .join('');
}

desarrolloSel.addEventListener('change', () => {
  document.getElementById('slotsWrap').style.display = 'block';
  cargarDisponibilidad();
});
fechaInput.addEventListener('change', () => {
  if(fechaInput.value < hoyStr()){ fechaInput.value = hoyStr(); }
  if(desarrolloSel.value) cargarDisponibilidad();
});

function updateDatetime(){
  const now = new Date();
  const opts = { weekday:'long', day:'numeric', month:'long' };
  const fecha = now.toLocaleDateString('es-MX', opts);
  const hora = now.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
  document.getElementById('datetime').textContent = fecha + ' · ' + hora;
}
updateDatetime();
setInterval(updateDatetime, 30000);

function setEstatus(v){
  estatusActual = v;
  document.getElementById('toggleOficina').classList.toggle('active', v === 'OFICINA');
  document.getElementById('toggleRecorrido').classList.toggle('active', v === 'RECORRIDO');
  document.getElementById('recorridoFields').classList.toggle('show', v === 'RECORRIDO');
  document.getElementById('errorMsg').classList.remove('show');
}

function showError(msg){
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function registrar(){
  const asesor = asesorSel.value;
  if(!asesor){ showError('Selecciona tu nombre.'); return; }
  if(!estatusActual){ showError('Selecciona Oficina o Recorrido.'); return; }

  let payload = {
    asesor: asesor,
    estatus: estatusActual,
    desarrollo: '',
    horaSalida: '',
    horaRegreso: ''
  };

  if(estatusActual === 'RECORRIDO'){
    const des = desarrolloSel.value;
    if(!des){ showError('Selecciona el desarrollo del recorrido.'); return; }
    if(!fechaInput.value){ showError('Selecciona la fecha del recorrido.'); return; }
    if(slotStartIdx === null || slotEndIdx === null){ showError('Selecciona un horario de inicio y uno de fin.'); return; }
    payload.desarrollo = des;
    payload.fecha = fechaInput.value;
    payload.horaSalida = SLOTS[slotStartIdx].start;
    payload.horaRegreso = SLOTS[slotEndIdx].end;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Registrando...';

  // Truco anti-preflight: content-type text/plain, Apps Script lee el JSON crudo en e.postData.contents
  fetch(DEPLOY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(res => {
    if(res.ok){
      document.getElementById('confirmTitle').textContent = estatusActual === 'OFICINA' ? 'En oficina' : 'Recorrido agendado';
      if(estatusActual === 'OFICINA'){
        const hora = new Date().toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
        document.getElementById('confirmDetail').textContent = asesor + ' · ' + hora;
      } else {
        document.getElementById('confirmDetail').textContent = asesor + ' · ' + fechaLegible(payload.fecha) + ' · ' + payload.horaSalida + ' a ' + payload.horaRegreso + ' · ' + payload.desarrollo;
      }
      document.getElementById('formWrap').classList.add('hidden');
      document.getElementById('confirmBox').classList.add('show');
    } else if(res.error === 'horario_ocupado'){
      showError(res.mensaje || 'Ese horario ya lo tomó otro asesor. Elige otro.');
      slotStartIdx = null;
      slotEndIdx = null;
      cargarDisponibilidad(); // refresca de inmediato para que ya no aparezca ese horario
    } else if(res.error === 'ocupado_temporal'){
      showError(res.mensaje || 'El sistema está ocupado, intenta de nuevo en unos segundos.');
    } else {
      showError('No se pudo registrar. Intenta de nuevo.');
    }
  })
  .catch(() => showError('Sin conexión. Revisa tu internet e intenta de nuevo.'))
  .finally(() => {
    btn.disabled = false;
    btn.textContent = 'Registrar';
  });
}

function resetForm(){
  estatusActual = null;
  asesorSel.value = '';
  desarrolloSel.value = '';
  fechaInput.value = hoyStr();
  slotStartIdx = null;
  slotEndIdx = null;
  ocupados = [];
  document.getElementById('slotsWrap').style.display = 'none';
  document.getElementById('slotsGrid').innerHTML = '';
  document.getElementById('ocupadosList').innerHTML = '';
  document.getElementById('slotsStatus').textContent = 'Selecciona un desarrollo para ver horarios disponibles.';
  document.getElementById('toggleOficina').classList.remove('active');
  document.getElementById('toggleRecorrido').classList.remove('active');
  document.getElementById('recorridoFields').classList.remove('show');
  document.getElementById('confirmBox').classList.remove('show');
  document.getElementById('formWrap').classList.remove('hidden');
}
</script>
</body>
</html>
